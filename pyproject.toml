[build-system]
requires = ["scikit-build-core>=0.11"]
build-backend = "scikit_build_core.build"

[project]
name = "genetic-jax"
version = "0.1.0"
description = "Compact JAX implementation of genetIC cosmological initial conditions"
requires-python = ">=3.11"
dependencies = ["jax>=0.4.30", "numpy>=1.26", "h5py>=3.10"]

[project.optional-dependencies]
test = ["pytest>=8", "pynbody>=2"]

[project.scripts]
genetic-jax = "genetic.cli:main"
genetic-jax-mapper = "genetic.mapper:main"

[tool.scikit-build]
cmake.source-dir = "_cmake"
wheel.packages = ["genetic"]
build-dir = "build/{wheel_tag}"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E731", "E741"]
